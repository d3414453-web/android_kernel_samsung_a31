name: Build Kernel
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/VH-Devices/android_kernel_samsung_a31
          kernel-branch: lineage-19.1
          config: a31_defconfig
          arch: arm64
          android-version: 12
          aosp-gcc: true
          aosp-clang: true
          anykernel3: true
          extra-make-args: '["KCFLAGS=-DCONFIG_KALLSYMS_ALL"]'
